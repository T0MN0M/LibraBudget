<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap 5 CDN for CSS and JS -->

    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"

    ></script>

    <link rel="stylesheet" href="signup.css" />

  <body>
    <section class="" container>
      <form method="post" action="">
        <div class="row justify-content-center">
          <div class="col-sm-6">
            <label for="firstname" class="" control-label>First Name*</label>
            <input
              type="text"
              class="form-control"
              name="firstname"
              placeholder="Enter firstname"
              required
            />
          </div>
          <div class="col-sm-6">
            <label for="lastname" class="" control-label>Last Name*</label>
            <input
              type="text"
              class="form-control"
              name="lastname"
              placeholder="Enter lastname"
              required
            />
          </div>
        </div>

        <div class="row justify-content-center">
          <div class="col-sm-6">
            <label for="gender" class="" control-label>Gender</label>
            <label class="radio-inline">
              <input type="radio" name="gender" value="M" />Male
            </label>
            <label class="radio-inline">
              <input type="radio" name="gender" value="F" />Female
            </label>
          </div>
          <div class="col-sm-6">
            <label for="age" class="" control-label>Age</label>
            <input
              type="number"
              class="form-control"
              name="age"
              placeholder="Enter age"
              required
            />
          </div>
        </div>

        <div class="row justify-content-center">
          <div class="col-sm-6">
            <label for="mobile" class="" control-label>Mobile Number</label>
            <input
              type="text"
              class="form-control"
              name="mobile"
              placeholder="Enter mobile"
              required
            />
            <small
              >Note: Fill both mobile and whatsapp fields in case of same
              number</small
            >
          </div>
          <div class="col-sm-6">
            <label for="whatsapp" class="" control-label>Whatsapp Number</label>
            <input
              type="text"
              class="form-control"
              name="whatsapp"
              placeholder="Enter whatsapp"
            />
          </div>
        </div>

        <div class="row justify-content-center">
          <div class="col-sm-6">
            <label for="email" class="" control-label>Email</label>
            <input
              type="email"
              class="form-control"
              name="email"
              placeholder="Enter email"
            />
          </div>
          <div class="col-sm-6">
            <label for="address" class="" control-label>Address</label>
            <input
              type="text"
              class="form-control"
              name="lastname"
              placeholder="Enter address"
            />
          </div>
        </div>

        <div class="row justify-content-center">
          <div class="col-sm-6">
            <label for="username" class="" control-label>Username*</label>
            <input
              type="text"
              class="form-control"
              name="username"
              placeholder="Enter username"
              required
            />
            <small>A unique username must be chosen</small>
          </div>
        </div>
        <div class="row justify-content-center">
          <div class="col-sm-6">
            <label for="password" class="" control-label>Password</label>
            <input
              type="password"
              class="form-control"
              name="password"
              placeholder="Enter password"
              required
            />
            <small>A secure password should be created</small>
          </div>
        </div>
        <div class="row justify-content-center">
          <div class="col-sm-6">
            <label for="verifypassword" class="" control-label
              >Verify Password*</label
            >
            <input
              type="password"
              class="form-control"
              name="verifypassword"
              placeholder="Enter Verify Password"
              required
            />
          </div>
        </div>

        <div class="row justify-content-center">
          <div class="col-sm-6">
            <button type="submit" class="btn btn-warning" name="submit">
              Submit
            </button>
          </div>
        </div>
      </form>

      <hr />
      <div class="row justify-content-center">
        <div class="row-bottom">
          <div class="col float-start">
            <p>
              Already have an account!
              <a href="..\Login_Page\login.html">Login</a>
            </p>
          </div>
          <div class="col float-end">
            <a href="home.php">Home (WIP)</a>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
